<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Domain Temporarily Suspended</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                   Roboto, Helvetica, Arial, sans-serif;
      background: #f6f7f9;
      color: #202124;
    }

    .container {
      width: 100%;
      max-width: 570px;
      text-align: center;
    }

    .icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 26px;
      border-radius: 50%;
      background: #eef0f2;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      color: #5f6368;
    }

    h1 {
      margin: 0 0 14px;
      font-size: 27px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .description {
      margin: 0 auto;
      max-width: 500px;
      color: #5f6368;
      font-size: 15px;
      line-height: 1.7;
    }

    .notice {
      margin-top: 28px;
      padding: 22px;
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 10px;
      color: #5f6368;
      font-size: 14px;
      line-height: 1.6;
      box-shadow: 0 3px 15px rgba(0,0,0,0.03);
    }

    .button {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 22px;
      border-radius: 7px;
      background: #202124;
      color: #fff;
      font-size: 14px;
      font-weight: 500;
      text-decoration: none;
      cursor: default;
    }

    .button:hover {
      opacity: 0.9;
    }

    .footer {
      margin-top: 25px;
      color: #9aa0a6;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      h1 {
        font-size: 23px;
      }

      .notice {
        padding: 19px;
      }
    }
  </style>
</head>

<body>

  <main class="container">

    <div class="icon">⌁</div>

    <h1>Domain Temporarily Suspended</h1>

    <p class="description">
      This domain has been temporarily suspended because
      the current domain service period has expired.
    </p>

    <div class="notice">
      Service will be restored once the domain renewal
      and associated service requirements have been completed.

      <br>

      <a href="#" class="button" onclick="return false;">
        Renew Domain &amp; Continue
      </a>
    </div>

    <div class="footer">
      Please check back later.
    </div>

  </main>

</body>
</html>
